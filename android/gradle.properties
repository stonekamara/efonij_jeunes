# Memoire Gradle reduite volontairement : le daemon etait tue par l'OOM killer
# sur machines a RAM limitee (-Xmx8G demandait jusqu'a 12G). Ne pas remonter
# sans verifier la RAM disponible. Ajuster si besoin sur machines plus riches.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
